spring.application.name=back

# Reads KEY=VALUE pairs from the .env file (repo root when launched from /back, or current dir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yohan}
spring.datasource.username=${POSTGRES_USER:yohan}
spring.datasource.password=${POSTGRES_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus

# Auth
app.auth.jwt-secret=${JWT_SECRET}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
app.auth.refresh-reuse-grace=10s
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.login-max-failures=5
app.auth.login-block-duration=15m
app.auth.admin-pseudo=${ADMIN_PSEUDO:admin-000000}
app.auth.admin-password=${ADMIN_PASSWORD:}
