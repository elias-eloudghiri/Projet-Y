spring.application.name=back

# Reads KEY=VALUE pairs from the .env file (repo root when launched from /back, or current dir)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:yohan}
spring.datasource.username=${POSTGRES_USER:yohan}
spring.datasource.password=${POSTGRES_PASSWORD:}

# Behind the front nginx: trust X-Forwarded-For from private-network proxies, so getRemoteAddr()
# returns the real client IP (needed by the login rate limiter).
server.forward-headers-strategy=native

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,prometheus

# Auth
app.auth.jwt-secret=${JWT_SECRET}
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
app.auth.refresh-reuse-grace=10s
# Guests get a single token, without refresh
app.auth.guest-token-ttl=24h
app.auth.cookie-secure=${COOKIE_SECURE:true}
app.auth.login-max-failures=5
app.auth.login-block-duration=15m
app.auth.admin-pseudo=${ADMIN_PSEUDO:admin-000000}
app.auth.admin-password=${ADMIN_PASSWORD:}

# Object storage (S3 API: SeaweedFS in dev, any S3 provider in prod)
app.storage.endpoint=${S3_ENDPOINT:http://localhost:8333}
app.storage.region=${S3_REGION:us-east-1}
app.storage.access-key=${S3_ACCESS_KEY:}
app.storage.secret-key=${S3_SECRET_KEY:}
app.storage.bucket=${S3_BUCKET:yohan}

# Stories. The multipart limits are derived from the PDF max size (see StoryUploadConfig).
app.stories.pdf-max-size=${STORY_PDF_MAX_SIZE:20MB}
