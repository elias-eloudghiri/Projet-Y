name: CI

on:
  push:
  pull_request:

# A new push on the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  back:
    name: Back · lint, compilation, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # verify = compile + tests (Testcontainers uses the runner's Docker) + spotless:check
      - name: Verify
        run: ./mvnw -B verify

  front:
    name: Front · lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run ci:lint
      - name: Type-check
        run: npm run type-check
      - name: Build
        run: npm run build-only

  images:
    name: Image ${{ matrix.app }}
    # Only on push (PRs never publish), once checks are green.
    if: github.event_name == 'push'
    needs: [back, front]
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: elias18
      # Empty until the DOCKERHUB_TOKEN secret is created: images are then built but not pushed.
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        app: [back, front]
    steps:
      - uses: actions/checkout@v4

      - id: registry
        name: Check Docker Hub token
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret DOCKERHUB_TOKEN missing: image ${{ matrix.app }} is built but not pushed."
          fi

      - uses: docker/setup-buildx-action@v3

      - if: steps.registry.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # docker.io/elias18/projet-y-<app>:<full commit SHA>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.DOCKERHUB_USERNAME }}/projet-y-${{ matrix.app }}
          tags: |
            type=sha,format=long,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: ${{ steps.registry.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
